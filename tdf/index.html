<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTC — Digital Transformation Delivery Framework</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ed;
    --ink: #1a1714;
    --gray: #6b6560;
    --card-bg: #ffffff;
    --border: rgba(26,23,20,0.10);
    --shadow: 0 2px 10px rgba(26,23,20,0.08);
    --radius: 8px;

    --col-header-bg: #0E2841;
    --col-header-ink: #ffffff;

    /* Domain row colors — 6 domeinen */
    --dom0-color: #156082; --dom0-light: #E3EEF5;  /* Organization & Identity */
    --dom1-color: #B84A0C; --dom1-light: #FAE8DC;  /* Processes */
    --dom2-color: #196B24; --dom2-light: #E3F0E5;  /* Applications */
    --dom3-color: #0076A3; --dom3-light: #DDF0F8;  /* Platform */
    --dom4-color: #7B2D8B; --dom4-light: #F2E3F7;  /* Data & AI */
    --dom5-color: #3A7A1F; --dom5-light: #E5F2DF;  /* People & Culture */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 36px 24px 80px;
  }

  /* HEADER */
  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  header p.subtitle {
    color: var(--gray);
    font-size: 0.88rem;
    margin-top: 6px;
    font-weight: 400;
  }
  header .badge {
    display: inline-block;
    margin-top: 12px;
    background: #fff3cd;
    border: 1px solid #e6c400;
    color: #7a5c00;
    border-radius: 20px;
    padding: 3px 14px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* MATRIX */
  .matrix-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(26,23,20,0.10);
    background: var(--card-bg);
  }
  .matrix {
    display: grid;
    grid-template-columns: 140px repeat(6, minmax(190px, 1fr));
    min-width: 1300px;
    border-radius: 14px;
    overflow: hidden;
  }

  .corner {
    background: var(--col-header-bg);
    border-right: 1px solid rgba(255,255,255,0.10);
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }

  .col-header {
    background: var(--col-header-bg);
    color: var(--col-header-ink);
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 14px 10px 12px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.10);
    border-bottom: 3px solid rgba(255,255,255,0.12);
  }
  .col-header .d-label {
    display: block;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* ROW LABELS — domeinkleur */
  .row-label {
    color: #ffffff;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 12px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
    border-right: 3px solid rgba(255,255,255,0.20);
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .row-label.domain-0 { background: var(--dom0-color); }
  .row-label.domain-1 { background: var(--dom1-color); }
  .row-label.domain-2 { background: var(--dom2-color); }
  .row-label.domain-3 { background: var(--dom3-color); }
  .row-label.domain-4 { background: var(--dom4-color); }
  .row-label.domain-5 { background: var(--dom5-color); }

  .cell {
    padding: 10px 8px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
    min-height: 80px;
    background: var(--card-bg);
  }

  /* Alternerende rij-tint */
  .row-even .cell { background: #faf9f7; }

  /* CHIPS — basis */
  .chip {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 0.68rem;
    font-weight: 500;
    line-height: 1.4;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s ease;
    cursor: pointer;
    position: relative;
  }
  .chip:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    filter: brightness(0.92);
  }
  .chip.linked {
    border-bottom: 1.5px solid currentColor;
    opacity: 0.95;
  }
  .chip.linked::after {
    content: ' ↗';
    font-size: 0.6rem;
    opacity: 0.6;
  }
  .chip.linked:hover { opacity: 1; }
  .chip.active-overlay {
    box-shadow: 0 0 0 2px currentColor;
    opacity: 1 !important;
  }

  /* Chipkleuren per domeinrij */
  .domain-0 .chip { background: var(--dom0-light); color: var(--dom0-color); }
  .domain-1 .chip { background: var(--dom1-light); color: var(--dom1-color); }
  .domain-2 .chip { background: var(--dom2-light); color: var(--dom2-color); }
  .domain-3 .chip { background: var(--dom3-light); color: var(--dom3-color); }
  .domain-4 .chip { background: var(--dom4-light); color: var(--dom4-color); }
  .domain-5 .chip { background: var(--dom5-light); color: var(--dom5-color); }

  /* OVERLAY */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,20,0.50);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .overlay-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 36px 40px 32px;
    max-width: 520px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(26,23,20,0.22);
    transform: translateY(16px) scale(0.97);
    transition: transform 0.22s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .overlay.active .overlay-card {
    transform: translateY(0) scale(1);
  }
  .overlay-close {
    position: absolute;
    top: 16px; right: 18px;
    background: none; border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--gray);
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.12s;
  }
  .overlay-close:hover { background: var(--bg); color: var(--ink); }

  .overlay-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .breadcrumb-domain {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.64rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .breadcrumb-sep { color: var(--gray); font-size: 0.75rem; opacity: 0.5; }
  .breadcrumb-phase {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .overlay-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    line-height: 1.25;
    margin-bottom: 12px;
    color: var(--ink);
    padding-right: 24px;
  }
  .overlay-desc {
    color: var(--gray);
    line-height: 1.65;
    font-size: 0.90rem;
    margin-bottom: 26px;
  }
  .overlay-section { margin-bottom: 18px; }
  .overlay-section-label {
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .overlay-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--ink);
    font-size: 0.82rem;
    font-weight: 500;
    margin-bottom: 4px;
    background: var(--bg);
    transition: background 0.12s;
  }
  .overlay-link:hover { background: #eae7e2; }
  .overlay-link .link-icon {
    font-size: 0.72rem;
    opacity: 0.45;
    margin-left: auto;
    flex-shrink: 0;
  }
  .overlay-empty {
    font-size: 0.78rem;
    color: var(--gray);
    opacity: 0.5;
    font-style: italic;
    padding: 4px 0;
  }

  /* LEGEND */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 28px;
    justify-content: center;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--gray);
    font-weight: 500;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-sep { color: var(--border); font-size: 1.2rem; line-height: 1; }
  .legend-linked {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--gray);
  }
  .legend-linked .chip-ex {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.67rem;
    background: #E3EEF5;
    color: #156082;
    border-bottom: 1.5px solid #156082;
    font-weight: 500;
  }
  .legend-linked .chip-ex::after { content: ' ↗'; font-size: 0.58rem; opacity: 0.6; }

  /* BACK LINK */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: var(--gray);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--ink); }
  .back-link::before { content: '←'; }
</style>
</head>

/* Bestandslinks per chip — voorlopig leeg */
const CHIP_FILES = {};

/* ---- OVERLAY LOGICA ---- */
const overlay     = document.getElementById('overlay');
const overlayClose = document.getElementById('overlay-close');
let activeChip = null;

function showOverlay(chip, chipLabel, domain, domainIdx, phase) {
  if (activeChip) activeChip.classList.remove('active-overlay');
  activeChip = chip;
  chip.classList.add('active-overlay');

  const color = DOMAIN_COLORS[domainIdx];

  // Breadcrumb
  const bc = document.getElementById('overlay-breadcrumb');
  bc.innerHTML =
    `<span class="breadcrumb-domain" style="background:${color}">${domain}</span>` +
    `<span class="breadcrumb-sep">—</span>` +
    `<span class="breadcrumb-phase">${phase}</span>`;

  // Titel
  document.getElementById('overlay-title').textContent = chipLabel;

  // Beschrijving
  const desc = CHIP_DESCRIPTIONS[chipLabel] || '';
  document.getElementById('overlay-desc').textContent = desc || '—';

  // Deepdives
  const deepdives = CHIP_LINKS[chipLabel] || [];
  const ddContainer = document.getElementById('overlay-deepdives');
  ddContainer.innerHTML = '';
  if (deepdives.length > 0) {
    deepdives.forEach(key => {
      const a = document.createElement('a');
      a.className = 'overlay-link';
      a.href = `../deepdive.html?page=${key}`;
      a.innerHTML = `<span>${DEEPDIVE_LABELS[key] || key}</span><span class="link-icon">↗</span>`;
      ddContainer.appendChild(a);
    });
    document.getElementById('overlay-deepdives-section').style.display = '';
  } else {
    const empty = document.createElement('p');
    empty.className = 'overlay-empty';
    empty.textContent = 'Geen deepdives gekoppeld';
    ddContainer.appendChild(empty);
    document.getElementById('overlay-deepdives-section').style.display = '';
  }

  // Bestanden
  const files = CHIP_FILES[chipLabel] || [];
  const filesContainer = document.getElementById('overlay-files');
  filesContainer.innerHTML = '';
  if (files.length > 0) {
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'overlay-link';
      a.href = f.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${f.label}</span><span class="link-icon">↗</span>`;
      filesContainer.appendChild(a);
    });
  }
  document.getElementById('overlay-files-section').style.display = files.length > 0 ? '' : 'none';

  overlay.classList.add('active');
  overlayClose.focus();
}

function hideOverlay() {
  overlay.classList.remove('active');
  if (activeChip) { activeChip.classList.remove('active-overlay'); activeChip = null; }
}

overlayClose.addEventListener('click', hideOverlay);
overlay.addEventListener('click', e => {
  if (e.target === overlay) hideOverlay();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideOverlay(); });

/* ---- MATRIX OPBOUWEN ---- */
function build() {
  const matrix = document.getElementById('matrix');

  // Hoekcel
  const corner = document.createElement('div');
  corner.className = 'corner';
  matrix.appendChild(corner);

  // Kolomkoppen
  PHASES.forEach(ph => {
    const div = document.createElement('div');
    div.className = 'col-header';
    div.innerHTML = `<span class="d-label">${ph.label}</span>`;
    matrix.appendChild(div);
  });

  // Domeinrijen
  DOMAINS.forEach((domain, rowIdx) => {
    const rowClass = rowIdx % 2 === 1 ? 'row-even' : 'row-odd';

    const label = document.createElement('div');
    label.className = `row-label domain-${rowIdx} ${rowClass}`;
    label.textContent = domain;
    matrix.appendChild(label);

    PHASES.forEach(ph => {
      const cell = document.createElement('div');
      cell.className = `cell domain-${rowIdx} ${rowClass}`;
      const items = (MATRIX[domain] || {})[ph.key] || [];

      items.forEach(item => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = item;
        chip.title = item;

        const deepdives = CHIP_LINKS[item];
        if (deepdives && deepdives.length > 0) {
          chip.classList.add('linked');
        }

        chip.addEventListener('click', e => {
          e.stopPropagation();
          if (activeChip === chip && overlay.classList.contains('active')) {
            hideOverlay();
          } else {
            showOverlay(chip, item, domain, rowIdx, ph.label);
          }
        });

        cell.appendChild(chip);
      });

      matrix.appendChild(cell);
    });
  });

  // Legenda — domeinrijen
  const legend = document.getElementById('legend');
  DOMAINS.forEach((domain, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${DOMAIN_COLORS[i]}"></span>${domain}`;
    legend.appendChild(item);
  });

  const sep = document.createElement('span');
  sep.className = 'legend-sep';
  sep.textContent = '|';
  legend.appendChild(sep);

  const ll = document.createElement('div');
  ll.className = 'legend-linked';
  ll.innerHTML = `<span class="chip-ex">chip</span> = koppeling naar deepdive`;
  legend.appendChild(ll);
}

build();
</script>
